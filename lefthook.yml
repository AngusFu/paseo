pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
        - "**/__fixtures__/difftastic/**"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      # Staging only files oxlint ignores (see ignorePatterns in .oxlintrc.json)
      # leaves it with nothing to lint, which it reports as an error — so a
      # commit touching just those paths could not pass the hook. Kept off the
      # `lint` script itself so a mistyped path still fails when run by hand.
      run: npm run lint -- --no-error-on-unmatched-pattern {staged_files}
    - name: typecheck
      run: npm run typecheck
